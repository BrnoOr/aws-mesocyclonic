# Página del proyecto en / y la app Streamlit de Vórtice en /app/, detrás de un solo puerto.
# El contenedor "vortice" corre Streamlit con STREAMLIT_SERVER_BASE_URL_PATH=app en la red Docker
# "vortice-net". El resolver de Docker y la variable $vortice dejan que nginx arranque aunque la app
# todavía no esté arriba (la resuelve en cada petición).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        resolver 127.0.0.11 valid=10s;
        set $vortice http://vortice:8501;
        proxy_pass $vortice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
