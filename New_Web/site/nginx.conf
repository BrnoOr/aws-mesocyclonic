# Sitio de Vórtice: la página de producto (con la consola) en / y la API de inferencia en /api/.
# La API corre en el contenedor "vortice-api" (uvicorn, puerto 8000) en la red Docker "vortice-net".
# El resolver de Docker y la variable $api dejan que nginx arranque aunque la API no esté arriba
# todavía; mientras tanto la consola usa los puntajes precalculados de assets/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://vortice-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    location /assets/ {
        expires 1h;
        gzip on;
        gzip_types application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
